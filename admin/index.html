<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel — Citumang Pangandaran</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"/>
  <link href="/src/styles/global.css" rel="stylesheet"/>
  <style>
    /* Admin-specific styles */
    :root {
      --admin-primary: #1a3a2a;
      --admin-primary-light: #2d5a3f;
      --admin-accent: #006a61;
      --admin-surface: #f8faf9;
      --admin-surface-card: #ffffff;
      --admin-text: #1a1c1a;
      --admin-text-secondary: #44474e;
      --admin-border: #c4c7c5;
      --admin-danger: #ba1a1a;
      --admin-success: #006d3b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--admin-surface);
      color: var(--admin-text);
      min-height: 100vh;
    }

    /* ===== LOGIN PAGE ===== */
    #login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a3a2a 0%, #0d2818 50%, #1a3a2a 100%);
      padding: 1rem;
    }

    .login-card {
      background: var(--admin-surface-card);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .login-card h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--admin-primary);
      margin-bottom: 0.25rem;
      text-align: center;
    }

    .login-card p.subtitle {
      font-size: 0.875rem;
      color: var(--admin-text-secondary);
      text-align: center;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--admin-text-secondary);
      margin-bottom: 0.375rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid var(--admin-border);
      border-radius: 10px;
      font-size: 0.9375rem;
      color: var(--admin-text);
      background: var(--admin-surface);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--admin-accent);
      box-shadow: 0 0 0 3px rgba(0,106,97,0.12);
    }

    .btn-login {
      width: 100%;
      padding: 0.875rem;
      background: var(--admin-accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 0.5rem;
    }

    .btn-login:hover { background: var(--admin-primary-light); }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-error {
      background: #fce4ec;
      color: var(--admin-danger);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.8125rem;
      margin-bottom: 1rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
    }

    .login-error.show { display: flex; }

    /* ===== DASHBOARD ===== */
    #dashboard-page { display: none; min-height: 100vh; }

    .admin-header {
      background: var(--admin-primary);
      color: #fff;
      padding: 0 1.5rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .admin-header h2 {
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .admin-header .user-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .admin-header .user-email {
      font-size: 0.8125rem;
      opacity: 0.8;
    }

    .btn-logout {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.5rem 1rem;
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-logout:hover { background: rgba(255,255,255,0.2); }

    .admin-layout {
      display: flex;
      min-height: calc(100vh - 64px);
    }

    /* Sidebar */
    .admin-sidebar {
      width: 260px;
      background: var(--admin-surface-card);
      border-right: 1px solid var(--admin-border);
      padding: 1.5rem 0;
      flex-shrink: 0;
    }

    @media (max-width: 768px) {
      .admin-sidebar {
        display: none;
        position: fixed;
        top: 64px;
        left: 0;
        bottom: 0;
        z-index: 90;
        width: 260px;
        box-shadow: 4px 0 12px rgba(0,0,0,0.1);
      }
      .admin-sidebar.open { display: block; }
    }

    .sidebar-nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--admin-text-secondary);
      cursor: pointer;
      transition: all 0.15s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .sidebar-nav-item:hover {
      background: rgba(0,106,97,0.06);
      color: var(--admin-accent);
    }

    .sidebar-nav-item.active {
      background: rgba(0,106,97,0.1);
      color: var(--admin-accent);
      font-weight: 600;
      border-right: 3px solid var(--admin-accent);
    }

    .sidebar-section-title {
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--admin-text-secondary);
      padding: 1.5rem 1.5rem 0.5rem;
      opacity: 0.6;
    }

    /* Main Content */
    .admin-content {
      flex: 1;
      padding: 2rem;
      max-width: 960px;
      overflow-y: auto;
    }

    @media (max-width: 768px) {
      .admin-content { padding: 1rem; }
    }

    .content-header {
      margin-bottom: 1.5rem;
    }

    .content-header h3 {
      font-size: 1.375rem;
      font-weight: 700;
      color: var(--admin-primary);
    }

    .content-header p {
      font-size: 0.875rem;
      color: var(--admin-text-secondary);
      margin-top: 0.25rem;
    }

    /* Cards */
    .admin-card {
      background: var(--admin-surface-card);
      border: 1px solid var(--admin-border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }

    .admin-card h4 {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--admin-primary);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 600px) {
      .field-row { grid-template-columns: 1fr; }
    }

    .field-group {
      margin-bottom: 1rem;
    }

    .field-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--admin-text-secondary);
      margin-bottom: 0.375rem;
    }

    .field-group input,
    .field-group textarea,
    .field-group select {
      width: 100%;
      padding: 0.625rem 0.875rem;
      border: 1.5px solid var(--admin-border);
      border-radius: 8px;
      font-size: 0.875rem;
      color: var(--admin-text);
      background: var(--admin-surface);
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    .field-group input:focus,
    .field-group textarea:focus {
      border-color: var(--admin-accent);
    }

    .field-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* Buttons */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.625rem 1.25rem;
      background: var(--admin-accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-primary:hover { background: var(--admin-primary-light); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.625rem 1.25rem;
      background: transparent;
      color: var(--admin-accent);
      border: 1.5px solid var(--admin-accent);
      border-radius: 8px;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(0,106,97,0.06);
    }

    .btn-danger {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.5rem 1rem;
      background: transparent;
      color: var(--admin-danger);
      border: 1.5px solid var(--admin-danger);
      border-radius: 8px;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-danger:hover {
      background: rgba(186,26,26,0.06);
    }

    .btn-group {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.25rem;
      flex-wrap: wrap;
    }

    /* Status messages */
    .status-msg {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.8125rem;
      font-weight: 500;
      margin-top: 1rem;
      display: none;
    }

    .status-msg.success {
      display: flex;
      background: #e8f5e9;
      color: var(--admin-success);
    }

    .status-msg.error {
      display: flex;
      background: #fce4ec;
      color: var(--admin-danger);
    }

    /* Activity/Facility items */
    .item-list { list-style: none; }

    .item-entry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.875rem 1rem;
      border: 1px solid var(--admin-border);
      border-radius: 8px;
      margin-bottom: 0.625rem;
      background: var(--admin-surface);
      transition: box-shadow 0.2s;
    }

    .item-entry:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

    .item-entry .item-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--admin-text);
    }

    .item-entry .item-sub {
      font-size: 0.75rem;
      color: var(--admin-text-secondary);
      margin-top: 0.125rem;
    }

    .item-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
      background: transparent;
      color: var(--admin-text-secondary);
    }

    .btn-icon:hover { background: rgba(0,0,0,0.06); }
    .btn-icon.danger:hover { background: rgba(186,26,26,0.08); color: var(--admin-danger); }

    /* Gallery grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
    }

    .gallery-item {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 4/3;
      background: #e0e0e0;
      cursor: pointer;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-item .gallery-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .gallery-item:hover .gallery-overlay { opacity: 1; }

    /* Dashboard overview cards */
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .overview-card {
      background: var(--admin-surface-card);
      border: 1px solid var(--admin-border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .overview-card .ov-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(0,106,97,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--admin-accent);
    }

    .overview-card .ov-label {
      font-size: 0.75rem;
      color: var(--admin-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .overview-card .ov-value {
      font-size: 1.375rem;
      font-weight: 700;
      color: var(--admin-primary);
    }

    /* Mobile sidebar toggle */
    .btn-sidebar-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: none;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      margin-right: 0.75rem;
    }

    @media (max-width: 768px) {
      .btn-sidebar-toggle { display: inline-flex; }
    }

    /* Edit modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 1rem;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-content {
      background: var(--admin-surface-card);
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }

    .modal-content h3 {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--admin-primary);
      margin-bottom: 1.25rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    /* Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: inline-block;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Loading screen */
    .loading-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--admin-surface);
    }

    .loading-screen .spinner-lg {
      width: 40px;
      height: 40px;
      border: 3px solid var(--admin-border);
      border-top-color: var(--admin-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* Back to site link */
    .back-to-site {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.8125rem;
      color: var(--admin-text-secondary);
      text-decoration: none;
      margin-top: 1.5rem;
      transition: color 0.2s;
    }

    .back-to-site:hover { color: var(--admin-accent); }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen" class="loading-screen">
    <div class="spinner-lg"></div>
  </div>

  <!-- ===== LOGIN PAGE ===== -->
  <div id="login-page" style="display:none;">
    <div class="login-card">
      <h1>Admin Panel</h1>
      <p class="subtitle">Citumang Pangandaran · Dashboard</p>

      <div id="login-error" class="login-error">
        <span class="material-symbols-outlined" style="font-size:18px;">error</span>
        <span id="login-error-text">Email atau password salah.</span>
      </div>

      <form id="login-form" autocomplete="off">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="admin@email.com" required autocomplete="email"/>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password"/>
        </div>
        <button type="submit" class="btn-login" id="btn-login">
          <span id="login-btn-text">Masuk</span>
        </button>
      </form>

      <a href="/" class="back-to-site">
        <span class="material-symbols-outlined" style="font-size:16px;">arrow_back</span>
        Kembali ke Website
      </a>
    </div>
  </div>

  <!-- ===== DASHBOARD PAGE ===== -->
  <div id="dashboard-page">
    <!-- Header -->
    <header class="admin-header">
      <div style="display:flex;align-items:center;">
        <button class="btn-sidebar-toggle" id="btn-sidebar-toggle" aria-label="Toggle menu">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <h2>Admin Panel</h2>
      </div>
      <div class="user-info">
        <span class="user-email" id="admin-email"></span>
        <button class="btn-logout" id="btn-logout">
          <span class="material-symbols-outlined" style="font-size:18px;">logout</span>
          Keluar
        </button>
      </div>
    </header>

    <div class="admin-layout">
      <!-- Sidebar -->
      <nav class="admin-sidebar" id="admin-sidebar">
        <div class="sidebar-section-title">Menu</div>
        <button class="sidebar-nav-item active" data-section="overview">
          <span class="material-symbols-outlined" style="font-size:20px;">dashboard</span>
          Dashboard
        </button>
        <button class="sidebar-nav-item" data-section="info">
          <span class="material-symbols-outlined" style="font-size:20px;">info</span>
          Informasi Website
        </button>
        <button class="sidebar-nav-item" data-section="pricing">
          <span class="material-symbols-outlined" style="font-size:20px;">payments</span>
          Harga & Paket
        </button>
        <button class="sidebar-nav-item" data-section="hours">
          <span class="material-symbols-outlined" style="font-size:20px;">schedule</span>
          Jam Operasional
        </button>
        <button class="sidebar-nav-item" data-section="facilities">
          <span class="material-symbols-outlined" style="font-size:20px;">spa</span>
          Fasilitas
        </button>
        <button class="sidebar-nav-item" data-section="activities">
          <span class="material-symbols-outlined" style="font-size:20px;">kayaking</span>
          Aktivitas
        </button>
        <button class="sidebar-nav-item" data-section="gallery">
          <span class="material-symbols-outlined" style="font-size:20px;">photo_library</span>
          Foto / Gallery
        </button>
      </nav>

      <!-- Main Content Area -->
      <div class="admin-content" id="admin-content">
        <!-- Sections are rendered by JS -->
      </div>
    </div>
  </div>

  <!-- ===== EDIT MODAL ===== -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal-content" id="edit-modal-content">
      <!-- Dynamic content -->
    </div>
  </div>

  <script type="module" src="/src/admin/admin.js"></script>
</body>
</html>
